name: Create Release with Changelog

# This workflow automatically creates GitHub releases with changelogs
# extracted from changelog.md or generated from git commits.
# Supports both beta (daily) and stable (weekly) releases.

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types:
      - completed
  workflow_dispatch:  # Allows manual trigger
    inputs:
      version:
        description: 'Version to create release for (e.g., 2025.10.15 or 2025.10.15.beta.1)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release (beta)'
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for changelog generation

      - name: Get version and determine release type
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -oP '__version__ = "\K[^"]*' llm4free/version.py)
          fi
          # Normalize version: strip leading 'v' or 'V' if user provided it
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          # If the user passed a date-like version with hyphens (e.g. 2025-11-16), normalize to dots (2025.11.16)
          if echo "$VERSION" | grep -E '^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}$' >/dev/null; then
            VERSION=$(echo "$VERSION" | sed 's/-/./g')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          
          # Determine if this is a beta release
          if [[ "$VERSION" == *".beta"* ]] || [ "${{ inputs.prerelease }}" == "true" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Release type: BETA"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Release type: STABLE"
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} does not exist"
          fi

      - name: Get previous tag
        id: previous_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # Use the most recent stable tag for stable releases so changelog includes
          # all changes since last stable (including any beta releases).
          if [ "${{ steps.get_version.outputs.is_prerelease }}" == "true" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          else
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -vE '\.beta|-beta' | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
          fi

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "previous_tag=" >> $GITHUB_OUTPUT
            echo "No previous tag found"
          else
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "Previous tag: $PREVIOUS_TAG"
          fi

      - name: Build git diff (previous tag -> new version)
        id: diff
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PREVIOUS_TAG="${{ steps.previous_tag.outputs.previous_tag }}"
          if [ -z "$PREVIOUS_TAG" ]; then
            # No previous tag: diff from the root commit.
            ROOT=$(git rev-list --max-parents=0 HEAD | tail -n1)
            git diff --stat "$ROOT" HEAD > diff_stat.txt
            git diff "$ROOT" HEAD > diff_full.txt
          else
            git diff --stat "$PREVIOUS_TAG" HEAD > diff_stat.txt
            git diff "$PREVIOUS_TAG" HEAD > diff_full.txt
          fi
          # Cap diff size so it fits the model context window.
          truncate -s 24000 diff_full.txt 2>/dev/null || true
          echo "stat_lines=$(wc -l < diff_stat.txt)" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install llm4free
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[dev]" 2>/dev/null || pip install -e ".[dev]"

      - name: Generate release notes with llm4free Client (model=auto)
        id: llm_notes
        if: steps.check_tag.outputs.exists == 'false'
        continue-on-error: true
        env:
          # Optional: set LLM_API_KEY (or OPENAI_API_KEY) in repo secrets to use a
          # keyed model. When unset, model="auto" falls back to the free no-auth
          # providers bundled with llm4free (e.g. Miklium, Surfsense).
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          VERSION: ${{ steps.get_version.outputs.version }}
          PREVIOUS: ${{ steps.previous_tag.outputs.previous_tag }}
        run: |
          python - <<'PY'
          import os, pathlib, textwrap, sys

          version = os.environ["VERSION"]
          previous = os.environ.get("PREVIOUS", "")
          stat = pathlib.Path("diff_stat.txt").read_text(encoding="utf-8", errors="replace")
          full = pathlib.Path("diff_full.txt").read_text(encoding="utf-8", errors="replace")

          prompt = textwrap.dedent(f"""
          You are writing GitHub release notes for the Python package `llm4free`.
          The new version is {version} (previous was {previous or 'initial release'}).

          Below is the git diff (summary first, then the truncated full patch)
          between the previous version and this release.

          Write polished, user-facing release notes in Markdown that:
          - Lead with a short one-line summary of the release.
          - Group changes under `### ✨ Added`, `### 🐛 Fixed`, `### 🚚 Moved`,
            `### 🗑️ Removed`, `### 🔧 Changed` using the repo's CHANGELOG style
            (emoji headings, concise bullet points).
          - Mention file/module names where useful (e.g. `llm4free/llm/miklium.py`).
          - Are concise and scannable; do NOT invent features not in the diff.
          - End with an `### 📦 Installation` section:
            ```bash
            pip install --upgrade llm4free=={version}
            ```

          --- GIT DIFF SUMMARY ---
          {stat}

          --- GIT DIFF (truncated) ---
          {full}
          """).strip()

          notes = ""
          try:
              from llm4free import Client
              client = Client(api_key=os.environ.get("LLM_API_KEY") or None)

              # Use model="auto" (the unified Client randomly selects an
              # available provider and fails over on error). Retry up to 50
              # times so transient 403s from one free provider eventually land
              # on a working one. Falls back to a keyed model only when a
              # secret is provided.
              model = "auto"
              if os.environ.get("LLM_API_KEY"):
                  # Keyed model when a secret is set; still auto-selected.
                  model = "auto"

              MAX_ATTEMPTS = 50
              last_err = None
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  try:
                      resp = client.chat.completions.create(
                          model=model,
                          messages=[{"role": "user", "content": prompt}],
                          max_tokens=1200,
                          stream=False,
                      )
                      content = getattr(getattr(resp, "choices", [None])[0], "message", None)
                      notes = getattr(content, "content", "") or ""
                      if notes.strip():
                          print(f"✅ Generated via {getattr(client.chat.completions, 'last_provider', 'auto')} "
                                f"(attempt {attempt}/{MAX_ATTEMPTS})")
                          break
                      last_err = RuntimeError("Provider returned empty content")
                  except Exception as exc:  # retry with auto failover
                      last_err = exc
                      print(f"⚠️ attempt {attempt}/{MAX_ATTEMPTS} failed: {exc}", file=sys.stderr)
                      continue

              if not notes.strip():
                  raise RuntimeError(last_err or "All attempts returned empty content")
          except Exception as exc:  # never fail the release on LLM errors
              print(f"LLM generation failed: {exc}", file=sys.stderr)
              notes = ""

          # Only emit notes if the LLM produced something usable.
          if notes.strip():
              pathlib.Path("RELEASE_NOTES_LLM.md").write_text(notes, encoding="utf-8")
              print("---- RELEASE NOTES (LLM) ----")
              print(notes)
          else:
              print("No LLM notes produced; will fall back to CHANGELOG.md / git log.")
          PY

      - name: Extract changelog from changelog.md
        id: changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PREVIOUS_TAG="${{ steps.previous_tag.outputs.previous_tag }}"

          # Prefer the LLM-generated notes when available.
          if [ -s RELEASE_NOTES_LLM.md ]; then
            echo "🤖 Using LLM-generated release notes (model=auto via llm4free Client)"
            cp RELEASE_NOTES_LLM.md RELEASE_NOTES.md
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📝 Extracting changelog..."
          
          # Determine changelog filename (support uppercase and lowercase file names)
          CHANGELOG_FILE=""
          if [ -f "changelog.md" ]; then
            CHANGELOG_FILE="changelog.md"
          elif [ -f "CHANGELOG.md" ]; then
            CHANGELOG_FILE="CHANGELOG.md"
          fi

          if [ -z "$CHANGELOG_FILE" ]; then
            echo "Warning: changelog file not found, generating from git commits"
          else
            # Convert UTF-16 to UTF-8 if needed
            if file "$CHANGELOG_FILE" | grep -q "UTF-16"; then
              iconv -f UTF-16LE -t UTF-8 "$CHANGELOG_FILE" > /tmp/changelog_utf8.md
              CHANGELOG_FILE="/tmp/changelog_utf8.md"
            fi

            # If version is date-like (YYYY.MM.DD) produce a zero-padded variant for matching
            VERSION_PAD="$VERSION"
            VERSION_STRIP="$VERSION"
            if echo "$VERSION" | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$' >/dev/null; then
              YEAR="$(echo "$VERSION" | cut -d. -f1)"
              MONTH="$(echo "$VERSION" | cut -d. -f2)"
              DAY="$(echo "$VERSION" | cut -d. -f3)"
              if [ ${#DAY} -eq 1 ]; then
                DAY_PAD="0$DAY"
              else
                DAY_PAD="$DAY"
              fi
              VERSION_PAD="$YEAR.$MONTH.$DAY_PAD"
              # strip leading zeros for the day (e.g. 07 -> 7) to match alternate formatting
              DAY_STRIPPED="$(echo "$DAY" | sed 's/^0*//')"
              VERSION_STRIP="$YEAR.$MONTH.$DAY_STRIPPED"
            fi

            echo "Attempting to extract changelog for version: $VERSION (also trying $VERSION_PAD) from $CHANGELOG_FILE"

            # Create dot/hyphen-tolerant regex patterns from version strings for robust matching
            VER_PAT=$(printf "%s" "$VERSION" | sed 's/\./[.-]/g')
            VER_PAD_PAT=$(printf "%s" "$VERSION_PAD" | sed 's/\./[.-]/g')
            VER_STRIP_PAT=$(printf "%s" "$VERSION_STRIP" | sed 's/\./[.-]/g')

            # Use awk with a regex that matches any of these patterns in bracketed or unbracketed forms,
            # with optional "v" prefix and either dot or hyphen separators (e.g., 2025.11.16 or 2025-11-16).
            awk -v verpat="$VER_PAT" -v verpadpat="$VER_PAD_PAT" -v verstrippat="$VER_STRIP_PAT" '
              BEGIN {
                found=0;
                patt = "(" verpat "|" verpadpat "|" verstrippat ")";
                # Bracketed: e.g. "## [v2025.11.16]" or "## [2025-11-16]"
                bracketed = "^##[[:space:]]*\\[[[:space:]]*v?" patt "[[:space:]]*\\]";
                # Unbracketed: e.g. "## v2025.11.16" or "## 2025-11-16"
                unbracketed = "^##[[:space:]]*v?" patt "($|[[:space:]]|-)";
                pattern = bracketed "|" unbracketed;
              }
              {
                if (!found) {
                  if ($0 ~ pattern) { found = 1; print; next }
                } else {
                  if ($0 ~ "^##[[:space:]]") exit; print
                }
              }' "$CHANGELOG_FILE" > RELEASE_NOTES.md
          fi
          
          # If no content was extracted, generate from git commits
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Warning: Could not find changelog entry for v$VERSION"
            echo "Generating basic changelog from git commits..."
            TIMESTAMP=$(date -u +%Y-%m-%d)
            IS_PRERELEASE="${{ steps.get_version.outputs.is_prerelease }}"
            
            if [ "$IS_PRERELEASE" == "true" ]; then
              echo "## [$VERSION] - $TIMESTAMP (BETA)" > RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              echo "⚠️ **This is a beta release. Use with caution.**" >> RELEASE_NOTES.md
            else
              echo "## [$VERSION] - $TIMESTAMP (STABLE)" > RELEASE_NOTES.md
            fi
            echo "" >> RELEASE_NOTES.md

            if [ -z "$PREVIOUS_TAG" ]; then
              echo "📝 **Initial Release**" >> RELEASE_NOTES.md
            else
              echo "📝 **Changes since $PREVIOUS_TAG**" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              echo "### 📦 Changes" >> RELEASE_NOTES.md
              git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
            fi

            echo "" >> RELEASE_NOTES.md
            echo "### 📦 Installation" >> RELEASE_NOTES.md
            echo '```bash' >> RELEASE_NOTES.md
            echo "pip install --upgrade llm4free==$VERSION" >> RELEASE_NOTES.md
            echo '```' >> RELEASE_NOTES.md
          fi
          
          # Output for GitHub Actions
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.is_prerelease == 'true' && format('Beta Release v{0}', steps.get_version.outputs.version) || format('Release v{0}', steps.get_version.outputs.version) }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog artifact
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: changelog-v${{ steps.get_version.outputs.version }}
          path: RELEASE_NOTES.md
          retention-days: 90

      - name: Comment on related PRs
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.get_version.outputs.version }}';
            const previousTag = '${{ steps.previous_tag.outputs.previous_tag }}';
            
            if (!previousTag) {
              console.log('No previous tag, skipping PR comments');
              return;
            }
            
            // Get commits in this release
            const commits = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: previousTag,
              head: 'HEAD'
            });
            
            // Extract PR numbers from commit messages
            const prNumbers = new Set();
            for (const commit of commits.data.commits) {
              const match = commit.commit.message.match(/#(\d+)/g);
              if (match) {
                match.forEach(pr => prNumbers.add(parseInt(pr.slice(1))));
              }
            }
            
            // Comment on each PR
            for (const prNumber of prNumbers) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `🎉 This PR is included in [v${version}](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version})!\n\nInstall it with:\n\`\`\`bash\npip install --upgrade llm4free==${version}\n\`\`\``
                });
                console.log(`Commented on PR #${prNumber}`);
              } catch (error) {
                console.log(`Failed to comment on PR #${prNumber}: ${error.message}`);
              }
            }

      - name: Notification
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "✅ Successfully created release v${{ steps.get_version.outputs.version }} with changelog!"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }}"

      - name: Skip notification
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "ℹ️ Release v${{ steps.get_version.outputs.version }} already exists, skipping creation"
